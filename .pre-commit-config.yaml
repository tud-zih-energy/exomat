repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check --
        language: system
        files: \.rs$
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy -- --no-deps -D warnings
        pass_filenames: false
        language: system
        files: \.rs$
